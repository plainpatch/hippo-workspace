<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hippo Agent 工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="appShell">
      <aside class="sidebar">
        <div class="systemNav">
          <button class="sysButton active" id="projectHomeBtn" data-system-view="chat" type="button"><span>▣</span>工作区</button>
          <button class="sysButton" id="knowledgeBtn" data-system-view="knowledge" type="button"><span>K</span>知识库</button>
          <button class="sysButton" id="agentsBtn" data-system-view="agents" type="button"><span>A</span>智能体</button>
          <button class="sysButton" id="inboxBtn" data-system-view="inbox" type="button"><span>W</span>待处理</button>
          <button class="sysButton" id="mcpBtn" type="button"><span>M</span>MCP</button>
          <button class="sysButton" id="createProjectBtn" type="button"><span>+</span>新建工作区</button>
        </div>

        <div class="projectsPane">
          <div id="projectList" class="projectList"></div>
        </div>

        <div class="accountPane">
          <button class="accountButton" id="runtimeBtn" type="button">
            <span class="avatar">J</span>
            <span>
              <strong>Jimmy</strong>
              <small id="runtimeSummary">本地运行时</small>
            </span>
          </button>
          <button class="settingsButton" id="settingsBtn" type="button" title="系统设置">⚙</button>
        </div>
      </aside>

      <main class="chatWorkspace">
        <header class="chatHeader">
          <div class="projectTitle">
            <span class="titleIcon">▣</span>
            <div>
              <h1 id="activeProjectName">选择或创建工作区</h1>
              <p id="activeProjectMeta">工作区管理本地目录、Agent 和知识库引用。</p>
            </div>
          </div>
          <div class="headerActions">
            <div id="runtimePills" class="pills"></div>
            <button id="projectConfigBtn" type="button">工作区设置</button>
            <button id="refreshBtn" type="button">刷新</button>
          </div>
        </header>

        <section id="chatStream" class="chatStream" aria-live="polite"></section>

        <form id="composerForm" class="composer">
          <textarea id="messageInput" name="message" rows="1" placeholder="描述任务；可选加载 Agent" required></textarea>
          <div class="composerBar">
            <div class="composerTools">
              <label class="modeSelect">Agent
                <select name="agentId" id="agentSelect">
                  <option value="">通用助手</option>
                </select>
              </label>
              <label class="modeSelect">权限
                <select name="sandboxMode" id="sandboxModeSelect">
                  <option value="">默认</option>
                  <option value="read-only">只读</option>
                  <option value="workspace-write">工作区写入</option>
                  <option value="danger-full-access">完全访问</option>
                </select>
              </label>
              <button id="stopExecutionBtn" class="stopExecutionButton hidden" type="button" title="停止当前运行">停止</button>
            </div>
            <button class="sendButton" type="submit" aria-label="发送">↑</button>
          </div>
        </form>
      </main>

      <aside id="configDrawer" class="configDrawer" aria-hidden="true">
        <div class="drawerHeader">
          <div>
            <h2 id="drawerTitle">工作区设置</h2>
            <p id="drawerSubtitle">创建或编辑工作区、可用 Agent 和知识库引用。</p>
          </div>
          <button id="closeDrawerBtn" type="button">关闭</button>
        </div>

        <form id="projectForm" class="drawerForm">
          <input name="id" type="hidden" />
          <label>工作区名称 <input name="name" required placeholder="例如：文档集成" /></label>
          <label>工作区说明 <textarea name="description" rows="4" placeholder="这个工作区要解决什么问题"></textarea></label>
          <div class="knowledgePicker">
            <div>
              <strong>工作区可用 Agent</strong>
              <p>工作区引用全局 Agent；对话中只能切换已启用的 Agent。</p>
            </div>
            <div id="projectAgentPicker" class="agentList"></div>
          </div>
          <div class="knowledgePicker">
            <div>
              <strong>工作区知识库引用</strong>
              <p>一级知识库作为授权边界；二级主题映射 RAG workspace，可留空表示检索该一级下全部主题。</p>
            </div>
            <input id="projectKnowledgeFilter" class="knowledgeFilterInput" type="search" placeholder="筛选知识库或主题" autocomplete="off" />
            <div id="projectKnowledgeTree" class="knowledgeTree"></div>
          </div>
          <button class="primary" type="submit">保存工作区</button>
        </form>

        <div id="agentListSection" class="drawerSection hidden"></div>

        <div class="drawerSection">
          <h3>系统知识库入库</h3>
          <form id="quickTextForm">
            <label>知识库目录 <input name="relativeDir" placeholder="例如：平台/AnythingLLM" /></label>
            <label>标题 <input name="title" required /></label>
            <label>文本 <textarea name="textContent" rows="5" required></textarea></label>
            <button type="submit">入库到系统知识库</button>
          </form>
        </div>

        <div class="drawerSection">
          <h3>运行状态</h3>
          <dl id="runtimeDetails" class="kv"></dl>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=dag-visual-editor" type="module"></script>
  </body>
</html>
