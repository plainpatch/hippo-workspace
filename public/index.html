<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hippo Agent 工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="appShell">
      <aside class="sidebar">
        <div class="systemNav">
          <button class="sysButton active" id="projectHomeBtn" data-system-view="chat" type="button"><span>▣</span>工作区</button>
          <button class="sysButton" id="knowledgeBtn" data-system-view="knowledge" type="button"><span>K</span>知识库</button>
          <button class="sysButton" id="agentsBtn" data-system-view="agents" type="button"><span>A</span>智能体</button>
          <button class="sysButton" id="inboxBtn" data-system-view="inbox" type="button"><span>W</span>待处理</button>
          <button class="sysButton" id="mcpBtn" type="button"><span>M</span>MCP</button>
          <button class="sysButton" id="createProjectBtn" type="button"><span>+</span>新建工作区</button>
        </div>

        <div class="projectsPane">
          <div id="projectList" class="projectList"></div>
        </div>

        <div class="accountPane">
          <button class="accountButton" id="runtimeBtn" type="button">
            <span class="avatar">J</span>
            <span>
              <strong>Jimmy</strong>
              <small id="runtimeSummary">本地运行时</small>
            </span>
          </button>
          <button class="settingsButton" id="settingsBtn" type="button" title="系统设置">⚙</button>
        </div>
      </aside>

      <main class="chatWorkspace">
        <header class="chatHeader">
          <div class="projectTitle">
            <span class="titleIcon">▣</span>
            <div>
              <h1 id="activeProjectName">选择或创建工作区</h1>
              <p id="activeProjectMeta">工作区管理本地目录、Agent 和知识库引用。</p>
            </div>
          </div>
          <div class="headerActions">
            <div id="runtimePills" class="pills"></div>
            <button id="projectConfigBtn" type="button">工作区设置</button>
            <button id="refreshBtn" type="button">刷新</button>
          </div>
        </header>

        <section id="chatStream" class="chatStream" aria-live="polite"></section>

        <form id="composerForm" class="composer">
          <textarea id="messageInput" name="message" rows="1" placeholder="描述任务；可选加载 Agent" required></textarea>
          <div class="composerBar">
            <div class="composerTools">
              <button id="attachTextBtn" type="button" title="入库">+ 入库</button>
              <label class="modeSelect">Agent
                <select name="agentId" id="agentSelect">
                  <option value="">通用助手</option>
                </select>
              </label>
              <label class="modeSelect">模式
                <select name="mode">
                  <option value="">自动选择</option>
                  <option value="query">检索问答</option>
                  <option value="chat">对话</option>
                  <option value="automatic">自动</option>
                </select>
              </label>
              <label class="modeSelect">上下文
                <select name="contextStrategy" id="contextStrategySelect">
                  <option value="runtime">续接</option>
                  <option value="reset">重置</option>
                  <option value="manual-summary">摘要</option>
                </select>
              </label>
              <label class="modeSelect">权限
                <select name="sandboxMode" id="sandboxModeSelect">
                  <option value="">默认</option>
                  <option value="read-only">只读</option>
                  <option value="workspace-write">工作区写入</option>
                  <option value="danger-full-access">完全访问</option>
                </select>
              </label>
              <label class="dryRunToggle"><input name="dryRun" type="checkbox" /> 仅生成请求</label>
              <button id="stopExecutionBtn" class="stopExecutionButton hidden" type="button" title="停止当前运行">停止</button>
            </div>
            <button class="sendButton" type="submit" aria-label="发送">↑</button>
          </div>
          <textarea id="contextSummaryInput" class="contextSummaryInput hidden" name="contextSummary" rows="2" placeholder="填入压缩后的上文摘要；本轮会开启新的 runtime session"></textarea>
        </form>
      </main>

      <aside id="configDrawer" class="configDrawer" aria-hidden="true">
        <div class="drawerHeader">
          <div>
            <h2 id="drawerTitle">工作区设置</h2>
            <p id="drawerSubtitle">创建或编辑工作区、可用 Agent 和知识库引用。</p>
          </div>
          <button id="closeDrawerBtn" type="button">关闭</button>
        </div>

        <form id="projectForm" class="drawerForm">
          <input name="id" type="hidden" />
          <label>工作区名称 <input name="name" required placeholder="例如：文档集成" /></label>
          <label>工作区说明 <textarea name="description" rows="4" placeholder="这个工作区要解决什么问题"></textarea></label>
          <div class="knowledgePicker">
            <div>
              <strong>工作区可用 Agent</strong>
              <p>工作区引用全局 Agent；对话中只能切换已启用的 Agent。</p>
            </div>
            <div id="projectAgentPicker" class="agentList"></div>
          </div>
          <div class="knowledgePicker">
            <div>
              <strong>工作区知识库引用</strong>
              <p>一级知识库作为授权边界；二级主题映射 RAG workspace，可留空表示检索该一级下全部主题。</p>
            </div>
            <input id="projectKnowledgeFilter" class="knowledgeFilterInput" type="search" placeholder="筛选知识库或主题" autocomplete="off" />
            <div id="projectKnowledgeTree" class="knowledgeTree"></div>
          </div>
          <button class="primary" type="submit">保存工作区</button>
        </form>

        <form id="agentForm" class="drawerForm hidden">
          <input name="id" type="hidden" />
          <label>Agent 类型
            <select name="type" id="agentTypeSelect">
              <option value="single">单节点</option>
              <option value="dag">DAG 编排</option>
            </select>
          </label>
          <label>Agent 名称 <input name="name" required placeholder="例如：文档审查 Agent" /></label>
          <label>Agent 说明 <input name="description" placeholder="这个 Agent 擅长什么任务" /></label>
          <label>系统提示词
            <textarea name="systemPrompt" rows="6" placeholder="定义这个 Agent 应该如何工作"></textarea>
          </label>
          <label>可访问 Skill
            <textarea name="skills" rows="5" placeholder="检索回答: 基于绑定知识库组织答案&#10;审查: 识别风险和缺失证据"></textarea>
          </label>
          <label>可访问 MCP
            <textarea name="mcpServers" rows="3" placeholder="例如：hippo-system&#10;github"></textarea>
          </label>
          <label>Runtime
            <select name="runtimeId">
              <option value="codex">Codex</option>
            </select>
          </label>
          <label>补充 RAG 文档名
            <textarea name="ragDocumentNames" rows="3" placeholder="可选：custom-documents/example.json"></textarea>
          </label>
          <div class="formGrid">
            <label>默认模式
              <select name="defaultMode">
                <option value="query">检索问答</option>
                <option value="chat">对话</option>
                <option value="automatic">自动</option>
              </select>
            </label>
            <label>Top N <input name="topN" type="number" min="1" value="4" /></label>
          </div>
          <div id="agentDagFields" class="dagFields hidden">
            <label>Root Node ID <input name="rootNodeId" placeholder="例如：root" /></label>
            <label>并发数 <input name="dagConcurrency" type="number" min="1" max="8" value="4" /></label>
            <div class="dagBuilder">
              <div class="dagBuilderHeader">
                <strong>图编辑器</strong>
                <button id="syncDagJsonBtn" type="button">同步 JSON</button>
              </div>
              <div class="dagBuilderGrid">
                <div class="dagBuilderPanel">
                  <label>节点 ID <input id="dagNodeIdInput" placeholder="root" /></label>
                  <label>节点名称 <input id="dagNodeNameInput" placeholder="Root" /></label>
                  <label>节点类型
                    <select id="dagNodeKindInput">
                      <option value="task">任务</option>
                      <option value="wait">等待</option>
                    </select>
                  </label>
                  <button id="addDagNodeBtn" type="button">添加节点</button>
                </div>
                <div class="dagBuilderPanel">
                  <label>From <select id="dagEdgeFromInput"></select></label>
                  <label>To <select id="dagEdgeToInput"></select></label>
                  <label>关系
                    <select id="dagEdgeTypeInput">
                      <option value="serial">串行</option>
                      <option value="parallel">并行</option>
                    </select>
                  </label>
                  <label class="dryRunToggle"><input id="dagEdgeRequiredInput" type="checkbox" checked /> required</label>
                  <button id="addDagEdgeBtn" type="button">添加连边</button>
                </div>
              </div>
              <div id="dagGraphPreview" class="dagGraphPreview"></div>
            </div>
            <label>DAG Nodes JSON
              <textarea name="nodesJson" rows="7" placeholder='[{"id":"root","kind":"task","name":"Root"},{"id":"approval","kind":"wait","name":"人工确认"}]'></textarea>
            </label>
            <label>DAG Edges JSON
              <textarea name="edgesJson" rows="5" placeholder='[{"from":"root","to":"review","type":"serial"}]'></textarea>
            </label>
          </div>
          <button class="primary" type="submit">保存 Agent</button>
        </form>

        <div id="agentListSection" class="drawerSection hidden">
          <h3>已创建 Agent</h3>
          <div id="agentList" class="agentList"></div>
        </div>

        <div class="drawerSection">
          <h3>系统知识库入库</h3>
          <form id="quickTextForm">
            <label>知识库目录 <input name="relativeDir" placeholder="例如：平台/AnythingLLM" /></label>
            <label>标题 <input name="title" required /></label>
            <label>文本 <textarea name="textContent" rows="5" required></textarea></label>
            <button type="submit">入库到系统知识库</button>
          </form>
        </div>

        <div class="drawerSection">
          <h3>运行状态</h3>
          <dl id="runtimeDetails" class="kv"></dl>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=turn-sandbox-control" type="module"></script>
  </body>
</html>
