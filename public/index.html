<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hippo Agent 工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="appShell">
      <aside class="sidebar">
        <div class="systemNav">
          <button class="sysButton active" id="newChatBtn" type="button"><span>+</span>新对话</button>
          <button class="sysButton" id="createProjectBtn" type="button"><span>P</span>新建项目</button>
          <button class="sysButton" id="searchBtn" type="button"><span>/</span>搜索</button>
          <button class="sysButton" id="agentsBtn" type="button"><span>A</span>智能体</button>
          <button class="sysButton" id="knowledgeBtn" type="button"><span>K</span>知识库</button>
          <button class="sysButton" id="mcpBtn" type="button"><span>M</span>MCP</button>
        </div>

        <div class="projectsPane">
          <div id="projectList" class="projectList"></div>
        </div>

        <div class="accountPane">
          <button class="accountButton" id="runtimeBtn" type="button">
            <span class="avatar">J</span>
            <span>
              <strong>Jimmy</strong>
              <small id="runtimeSummary">本地运行时</small>
            </span>
          </button>
          <button class="settingsButton" id="settingsBtn" type="button" title="系统设置">⚙</button>
        </div>
      </aside>

      <main class="chatWorkspace">
        <header class="chatHeader">
          <div class="projectTitle">
            <span class="titleIcon">▣</span>
            <div>
              <h1 id="activeProjectName">选择或创建项目</h1>
              <p id="activeProjectMeta">项目管理本地目录、Agent 和知识抽屉授权。</p>
            </div>
          </div>
          <div class="headerActions">
            <div id="runtimePills" class="pills"></div>
            <button id="projectConfigBtn" type="button">项目</button>
            <button id="refreshBtn" type="button">刷新</button>
          </div>
        </header>

        <section id="chatStream" class="chatStream" aria-live="polite"></section>

        <form id="composerForm" class="composer">
          <textarea id="messageInput" name="message" rows="1" placeholder="描述任务；可选加载 Agent" required></textarea>
          <div class="composerBar">
            <div class="composerTools">
              <button id="attachTextBtn" type="button" title="入库">+ 入库</button>
              <label class="modeSelect">Agent
                <select name="agentId" id="agentSelect">
                  <option value="">通用助手</option>
                </select>
              </label>
              <label class="modeSelect">模式
                <select name="mode">
                  <option value="">自动选择</option>
                  <option value="query">检索问答</option>
                  <option value="chat">对话</option>
                  <option value="automatic">自动</option>
                </select>
              </label>
              <label class="dryRunToggle"><input name="dryRun" type="checkbox" /> 仅生成请求</label>
            </div>
            <button class="sendButton" type="submit" aria-label="发送">↑</button>
          </div>
        </form>
      </main>

      <aside id="configDrawer" class="configDrawer" aria-hidden="true">
        <div class="drawerHeader">
          <div>
            <h2 id="drawerTitle">项目</h2>
            <p id="drawerSubtitle">创建或编辑 project、可用 Agent 和知识抽屉授权。</p>
          </div>
          <button id="closeDrawerBtn" type="button">关闭</button>
        </div>

        <form id="projectForm" class="drawerForm">
          <input name="id" type="hidden" />
          <label>项目名称 <input name="name" required placeholder="例如：文档集成" /></label>
          <label>项目说明 <textarea name="description" rows="4" placeholder="这个 project 要解决什么问题"></textarea></label>
          <div class="knowledgePicker">
            <div>
              <strong>项目可用 Agent</strong>
              <p>项目引用全局 Agent；对话中只能切换已启用的 Agent。</p>
            </div>
            <div id="projectAgentPicker" class="agentList"></div>
          </div>
          <div class="knowledgePicker">
            <div>
              <strong>项目知识抽屉授权</strong>
              <p>只按一级抽屉授权；二级抽屉作为检索 tag。</p>
            </div>
            <div id="projectKnowledgeTree" class="knowledgeTree"></div>
          </div>
          <button class="primary" type="submit">保存项目</button>
        </form>

        <form id="agentForm" class="drawerForm hidden">
          <input name="id" type="hidden" />
          <label>Agent 名称 <input name="name" required placeholder="例如：文档审查 Agent" /></label>
          <label>Agent 说明 <input name="description" placeholder="这个 Agent 擅长什么任务" /></label>
          <label>系统提示词
            <textarea name="systemPrompt" rows="6" placeholder="定义这个 Agent 应该如何工作"></textarea>
          </label>
          <label>可访问 Skill
            <textarea name="skills" rows="5" placeholder="检索回答: 基于绑定知识库组织答案&#10;审查: 识别风险和缺失证据"></textarea>
          </label>
          <label>可访问 MCP
            <textarea name="mcpServers" rows="3" placeholder="例如：hippo-system&#10;github"></textarea>
          </label>
          <label>Runtime
            <select name="runtimeId">
              <option value="codex">Codex</option>
            </select>
          </label>
          <label>补充 RAG 文档名
            <textarea name="ragDocumentNames" rows="3" placeholder="可选：custom-documents/example.json"></textarea>
          </label>
          <div class="formGrid">
            <label>默认模式
              <select name="defaultMode">
                <option value="query">检索问答</option>
                <option value="chat">对话</option>
                <option value="automatic">自动</option>
              </select>
            </label>
            <label>Top N <input name="topN" type="number" min="1" value="4" /></label>
          </div>
          <button class="primary" type="submit">保存 Agent</button>
        </form>

        <div id="agentListSection" class="drawerSection hidden">
          <h3>已创建 Agent</h3>
          <div id="agentList" class="agentList"></div>
        </div>

        <div class="drawerSection">
          <h3>系统知识库入库</h3>
          <form id="quickTextForm">
            <label>知识库目录 <input name="relativeDir" placeholder="例如：平台/AnythingLLM" /></label>
            <label>标题 <input name="title" required /></label>
            <label>文本 <textarea name="textContent" rows="5" required></textarea></label>
            <button type="submit">入库到系统知识库</button>
          </form>
        </div>

        <div class="drawerSection">
          <h3>运行状态</h3>
          <dl id="runtimeDetails" class="kv"></dl>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
